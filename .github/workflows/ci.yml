name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt mypy
      - run: mypy main.py routers/ auth.py models.py schemas.py audit.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beer
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: beerdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beer -d beerdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pytest-cov
      - name: Security scan
        run: pip install bandit pip-audit && bandit -r . -ll -q --exclude ./tests && pip-audit
        continue-on-error: true
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-omit="tests/*,alembic/*"
        env:
          DATABASE_URL: postgresql+asyncpg://beer:testpass@localhost:5432/beerdb_test
          REDIS_URL: redis://localhost:6379/0
          ADMIN_SECRET_KEY: ci-test-secret-key-32chars-minimum
          ADMIN_USER: admin
          ADMIN_PASS: testpass
          PAYMENT_MODE: mock
          DEMO_MODE: "true"
